name: CI

on: [push, pull_request]

jobs:
  terraform-lint:
    name: Terraform fmt & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: '1.6.7'
      - name: Terraform fmt (check)
        run: terraform -chdir=terraform fmt -check
      - name: Terraform init & validate
        run: |
          terraform -chdir=terraform init -no-color
          terraform -chdir=terraform validate -no-color

  test:
    name: Integration tests (LocalStack)
    needs: terraform-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: '1.6.7'

      - name: Start LocalStack (pinned)
        run: |
          docker pull localstack/localstack:0.14.3
          docker run -d --name localstack -p 4566:4566 localstack/localstack:0.14.3
          # wait for health endpoint
          for i in {1..30}; do
            curl -fsS http://localhost:4566/health && echo "LocalStack ready" && break || sleep 2
          done

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Terraform init & apply (against LocalStack)
        env:
          AWS_ENDPOINT_URL: http://localhost:4566
        run: |
          terraform -chdir=terraform init -no-color
          terraform -chdir=terraform apply -auto-approve -no-color

      - name: Run smoke tests
        env:
          AWS_ENDPOINT_URL: http://localhost:4566
          BUCKET_NAME: platform-demo-bucket
        run: |
          python tests/smoke_test.py

      - name: Cleanup LocalStack
        if: always()
        run: |
          docker stop localstack || true
          docker rm localstack || true
